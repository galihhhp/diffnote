send_mode = "submit"
split = true
show_comments = true
adapters = ["rex", "tmux", "inbox", "clipboard"]
agents = ["pi", "claude", "codex", "opencode", "aider", "goose", "cline"]

new_tab_agent = "pi"
clipboard_command = "pbcopy"
editor_command = "nvim"
base_branch = "main"
update_command = "{update_script} {base}"
branchup_command = "{branchup_script} {branch} --base {base}"



[templates]
pi = 'pi -- @{file} "Please address these review comments"'
claude = 'claude "Please address the review comments in {file}"'
codex = 'codex "Please address the review comments in {file}"'
opencode = 'opencode run "Please address the review comments in {file}"'
aider = 'aider --message-file {file}'
goose = 'goose run --instructions {file}'
cline = 'cline "Please address the review comments in {file}"'

[keys]
quit = "q"
toggle_view = "Tab"
down = "j"
up = "k"
next_hunk = "]"
prev_hunk = "["
next_file = "f"
prev_file = "F"
comment = "c"
delete = "d"
send = "s"
new_tab = "t"
pick_target = "S"
copy = "y"
refresh = "gr"
stage = "ga"
stage_all = "gA"
unstage = "gu"
unstage_all = "gU"
stage_hunk = "gh"
commit = "gc"
help = "?"
toggle_split = "v"
toggle_comments = "b"
goto_file = "o"
focus_comments = "p"
toggle_whole_file = "M"
edit_comment = "m"
resend_comments = "R"
history = "L"
update_branch = "gs"
branchup = "gb"
search = "/"
next_match = "n"
prev_match = "N"
open_editor_tab = "e"
open_editor_float = "E"
newline = "C-j"
confirm = "Enter"
cancel = "Esc"
scroll_left = "h"
scroll_right = "l"
scroll_reset = "0"
pick_base = "gB"
rename_branch = "gn"
push = "gp"
stash_push = "gz"
stash_pop = "gZ"
take_ours = "go"
take_theirs = "gt"
continue_op = "gk"
abort_op = "gx"
next_conflict = "g]"
prev_conflict = "g["
force_push = "gP"
pull = "gl"
stage_selection = "A"
